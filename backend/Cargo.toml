[package]
name = "dbx-mail-backend"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
description = "DBX 邮件插件原生 Sidecar：IMAP 同步、SMTP 投递、SQLite 缓存与附件文件读写"
license = "GPL-3.0-or-later"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "fs"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-channel = "2"
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
webpki-roots = "0.26"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
mail-builder = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
